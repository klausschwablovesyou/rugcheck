[package]
name = "rugcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
# Only the HTTP JSON-RPC client is needed; `solana-client` would also pull in
# the QUIC/TPU/pubsub stack (and `ring` 0.16, which has no Windows ARM64 build).
solana-rpc-client = { version = "1.18", default-features = false }
solana-rpc-client-api = "1.18"
solana-account-decoder = "1.18"
solana-sdk = "1.18"
spl-token-2022 = { version = "1.0", features = ["no-entrypoint"] }
bytemuck = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"

[profile.release]
strip = true
lto = "thin"

# Dependencies are never stepped through; skipping their debuginfo makes dev
# builds of the ~400 crate tree noticeably faster and smaller.
[profile.dev.package."*"]
debug = false
